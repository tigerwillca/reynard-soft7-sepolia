# Deploys the public landing and metadata to GitHub Pages.
# One-time: Settings → Pages → Source: GitHub Actions.
name: Deploy Soft7 Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run if Settings has not been opened yet.
          enablement: true
      - name: Assemble public site
        run: bash scripts/assemble_public_site.sh "$GITHUB_WORKSPACE/_site"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Allowlisted public files only. .git, .github, .cursor, and scripts stay out.
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
